openapi: 3.0.3
info:
  title: Gimnasio API
  version: 1.0.0
  description: API REST para gestionar socios, clases e inscripciones de un gimnasio.
servers:
  - url: /api
tags:
  - name: Socios
  - name: Clases
  - name: Inscripciones

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Id numérico del recurso
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    Socio:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Juan }
        dni: { type: string, example: "12345678" }
        email: { type: string, format: email, example: juan@mail.com }
        plan: { type: string, enum: [mensual, trimestral, anual], example: mensual }
    SocioInput:
      type: object
      required: [nombre, dni, email, plan]
      properties:
        nombre: { type: string, minLength: 1, example: Juan }
        dni: { type: string, pattern: '^\d{7,8}$', example: "12345678" }
        email: { type: string, format: email, example: juan@mail.com }
        plan: { type: string, enum: [mensual, trimestral, anual], example: mensual }

    Clase:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Spinning }
        instructor: { type: string, example: Laura }
        dia: { type: string, enum: [lunes, martes, miercoles, jueves, viernes, sabado], example: lunes }
        horario: { type: string, example: "18:30" }
        cupo: { type: integer, example: 15 }
    ClaseInput:
      type: object
      required: [nombre, instructor, dia, horario, cupo]
      properties:
        nombre: { type: string, minLength: 1, example: Spinning }
        instructor: { type: string, minLength: 1, example: Laura }
        dia: { type: string, enum: [lunes, martes, miercoles, jueves, viernes, sabado], example: lunes }
        horario: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "18:30" }
        cupo: { type: integer, minimum: 1, example: 15 }

    Inscripcion:
      type: object
      properties:
        id: { type: integer, example: 1 }
        socioId: { type: integer, example: 1 }
        claseId: { type: integer, example: 1 }
    InscripcionInput:
      type: object
      required: [socioId, claseId]
      properties:
        socioId: { type: integer, minimum: 1, example: 1 }
        claseId: { type: integer, minimum: 1, example: 1 }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Datos inválidos }
            details:
              type: array
              items:
                type: object

  responses:
    BadRequest:
      description: Datos inválidos (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No encontrado (SOCIO_NO_ENCONTRADO, CLASE_NO_ENCONTRADA o INSCRIPCION_NO_ENCONTRADA)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto con una regla de negocio (DNI_DUPLICADO, YA_INSCRIPTO o CUPO_COMPLETO)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /socios:
    get:
      tags: [Socios]
      summary: Listar socios
      responses:
        "200":
          description: Lista de socios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Socio"
    post:
      tags: [Socios]
      summary: Crear un socio
      description: No se puede repetir el DNI de otro socio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioInput"
      responses:
        "201":
          description: Socio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /socios/{id}:
    get:
      tags: [Socios]
      summary: Obtener un socio por id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Socio encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Socios]
      summary: Actualizar un socio
      description: Se envían todos los campos. No se puede usar el DNI de otro socio.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioInput"
      responses:
        "200":
          description: Socio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Socios]
      summary: Eliminar un socio
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Socio eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /clases:
    get:
      tags: [Clases]
      summary: Listar clases
      responses:
        "200":
          description: Lista de clases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clase"
    post:
      tags: [Clases]
      summary: Crear una clase
      description: El cupo es la cantidad máxima de socios que pueden inscribirse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaseInput"
      responses:
        "201":
          description: Clase creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clase"
        "400":
          $ref: "#/components/responses/BadRequest"

  /clases/{id}:
    get:
      tags: [Clases]
      summary: Obtener una clase por id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Clase encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Clases]
      summary: Actualizar una clase
      description: Se envían todos los campos.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaseInput"
      responses:
        "200":
          description: Clase actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Clases]
      summary: Eliminar una clase
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Clase eliminada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /inscripciones:
    get:
      tags: [Inscripciones]
      summary: Listar inscripciones
      responses:
        "200":
          description: Lista de inscripciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inscripcion"
    post:
      tags: [Inscripciones]
      summary: Inscribir un socio en una clase
      description: >
        El socio y la clase tienen que existir (404). No se puede inscribir dos veces
        al mismo socio en la misma clase (409 YA_INSCRIPTO), ni cuando la clase llegó
        a su cupo (409 CUPO_COMPLETO). Al crearse, se emite el evento inscripcion.creada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscripcionInput"
      responses:
        "201":
          description: Inscripción creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inscripcion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /inscripciones/{id}:
    get:
      tags: [Inscripciones]
      summary: Obtener una inscripción por id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Inscripción encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inscripcion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Inscripciones]
      summary: Eliminar una inscripción
      description: Libera un lugar en el cupo de la clase.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Inscripción eliminada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"